[build]
  command = "npm run build:shared && npm run build:client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://api.onceclic.com"

# Proxy /api/* to Railway backend — must precede the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "https://api.onceclic.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing catch-all
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
